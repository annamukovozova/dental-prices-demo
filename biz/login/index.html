<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход в кабинет</title>
<style>
/* Вход в кабинет страховщиков, брокеров и клиник. Демо: проверка в браузере по хешу «логин:пароль»,
   это не защита данных — для платного доступа нужен вход на сервере. */
:root { color-scheme: light; --bg: #F4F6F8; --panel: #FFFFFF; --ink: #0A1628; --muted: #4A5868; --line: #D5DDE4; --acc: #1FA89A; --acc-ink: #0E6F66;
  --bad: #B42318; --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #0B1420; --panel: #121E2C; --ink: #E6EDF3; --muted: #9AABBC; --line: #24364A; --acc: #3CC4B5; --acc-ink: #7FE0D4; --bad: #F97066; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.55; }
.wrap { max-width: 420px; margin: 0 auto; padding: 48px 16px; }
.tag { font-size: 13px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
h1 { font-size: 26px; margin: 6px 0 8px; } .lead { color: var(--muted); margin: 0 0 20px; }
form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; }
label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
button { font: inherit; font-weight: 600; color: #fff; background: var(--acc); border: 0; border-radius: 8px; padding: 11px; cursor: pointer; }
.err { color: var(--bad); font-size: 14px; min-height: 1.4em; margin: 0; }
.foot { font-size: 14px; color: var(--muted); margin-top: 18px; } .foot a { color: var(--acc-ink); }
</style>
</head>
<body><div class="wrap">
<div class="tag">Страховщики · брокеры · клиники</div>
<h1>Вход в кабинет</h1>
<p class="lead">Справка по клинике к переговорам о ценах, рынок и инфляция, сверка договорного прайса с публичным. Доступ по подписке, логин и пароль выдаём по запросу.</p>
<form id="f" autocomplete="on">
  <label>Логин<input id="u" name="username" autocomplete="username" required></label>
  <label>Пароль<input id="p" name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Войти</button>
  <p class="err" id="err" role="alert"></p>
</form>
<p class="foot"><a href="../../dlya-biznesa/">Что даёт кабинет и как получить доступ</a> · <a href="../../">Цены для пациентов</a></p>
</div>
<script>
(function () {
  var OK = ['4dc79cb53b828ab4b70243af821b5bbfd01879b8a4309400f79c6679c1355be6'];   // sha256("логин:пароль"): test
  var store = function (v) { try { localStorage.setItem('biz-auth', v); } catch (e) { try { sessionStorage.setItem('biz-auth', v); } catch (e2) {} } };
  var next = function () {
    var n = new URLSearchParams(location.search).get('next') || '';
    return /^\/[^\/]/.test(n) && n.indexOf('//') < 0 ? n : '../';   // только адреса этого сайта
  };
  async function sha(s) {
    var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
  }
  document.getElementById('f').onsubmit = async function (ev) {
    ev.preventDefault();
    var err = document.getElementById('err'); err.textContent = '';
    var u = document.getElementById('u').value.trim().toLowerCase(), p = document.getElementById('p').value;
    try {
      if (OK.indexOf(await sha(u + ':' + p)) >= 0) { store(String(Date.now())); location.replace(next()); }   // вход живёт сутки
      else err.textContent = 'Неверный логин или пароль.';
    } catch (e) { err.textContent = 'Браузер не смог проверить пароль. Откройте страницу по https.'; }
  };
})();
</script>
</body></html>
