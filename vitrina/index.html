<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сколько стоит пломба в Москве</title>
<style>
/* Витрина для пациентов: выбор услуги и случая -> цена по Москве -> клиники списком. Данные — data.json (tools/build_vitrina.py). */
:root { color-scheme: light;
  --bg: #F4F6F8; --panel: #FFFFFF; --ink: #0A1628; --muted: #4A5868; --line: #D5DDE4;
  --acc: #1FA89A; --acc-ink: #0E6F66; --soft: #E3F4F1; --warn: #B45309; --warn-soft: #FDF3E7;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark;
  --bg: #0B1420; --panel: #121E2C; --ink: #E6EDF3; --muted: #9AABBC; --line: #24364A;
  --acc: #3CC4B5; --acc-ink: #7FE0D4; --soft: #12302D; --warn: #F0A35E; --warn-soft: #2E2214; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 56px; }
.top { font-size: 13px; color: var(--muted); } .top a { color: inherit; }
h1 { font-size: clamp(26px, 5vw, 34px); line-height: 1.2; margin: 12px 0 6px; text-wrap: balance; }
.lead { margin: 0 0 6px; color: var(--muted); max-width: 70ch; }
.draft { display: inline-block; font-size: 13px; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 3px 10px; margin: 6px 0 18px; }
.filters { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); margin-bottom: 16px; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
.tab { font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
.tab:disabled { opacity: .55; cursor: default; }
.tab small { font-size: 12px; opacity: .8; }
.cases { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); margin-bottom: 18px; }
.case { text-align: left; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.case b { display: block; font-size: 17px; } .case span { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.case[aria-pressed="true"] { border-color: var(--acc); box-shadow: inset 0 0 0 2px var(--acc); background: var(--soft); }
.summary { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; display: grid; gap: 6px; }
.summary .big { font-size: clamp(26px, 6vw, 36px); font-weight: 700; font-variant-numeric: tabular-nums; }
.summary .sub { color: var(--muted); font-size: 14px; }
.mode { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 14px; }
.list { display: grid; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.card .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.card .name { font-weight: 650; font-size: 17px; }
.card .price { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card .where { font-size: 14px; color: var(--muted); }
.parts { font-size: 14px; display: grid; gap: 2px; }
.parts div { display: grid; grid-template-columns: 6.5rem 1fr auto; gap: 8px; }
.parts .k { color: var(--muted); } .parts .v { color: var(--muted); overflow-wrap: anywhere; } .parts .p { font-variant-numeric: tabular-nums; white-space: nowrap; }
.links { font-size: 14px; display: flex; gap: 14px; flex-wrap: wrap; } .links a { color: var(--acc-ink); }
.note { font-size: 13px; color: var(--warn); }
details.more { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
details.more summary { cursor: pointer; font-weight: 600; }
details.more li { font-size: 14px; margin: 6px 0; overflow-wrap: anywhere; }
.foot { font-size: 13px; color: var(--muted); margin-top: 24px; max-width: 75ch; }
.rate { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rate iframe { width: 150px; height: 50px; border: 0; border-radius: 8px; background: #fff; }
.btn { font: inherit; font-size: 14px; color: var(--acc-ink); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
dialog.rev { border: 0; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--panel); color: var(--ink); }
dialog.rev::backdrop { background: rgba(10, 22, 40, .55); }
dialog.rev .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 14px; }
dialog.rev iframe { display: block; width: 100%; height: min(700px, calc(100vh - 120px)); border: 0; background: #fff; }
.empty { color: var(--muted); padding: 12px 0; }
</style>
</head>
<body>
<div class="wrap">
  <p class="top"><a href="../">← все черновики</a></p>
  <h1>Сколько стоит лечение зубов в Москве</h1>
  <p class="lead">Цены из прайсов, которые клиники публикуют на своих сайтах. Выберите услугу и свой случай, сравните клиники и откройте прайс, чтобы проверить строку.</p>
  <span class="draft">Черновик: цены выбраны правилами, строки не сверены вручную</span>

  <div class="filters">
    <label class="f">Город<select id="city"><option>Москва</option><option disabled>Другие города — скоро</option></select></label>
    <label class="f">Метро<select id="metro"><option value="">Все станции</option></select></label>
  </div>
  <div class="tabs" role="group" aria-label="Услуга">
    <button class="tab" aria-pressed="true">Пломба</button>
    <button class="tab" disabled>Каналы <small>скоро</small></button>
    <button class="tab" disabled>Коронка <small>скоро</small></button>
    <button class="tab" disabled>Имплант под ключ <small>скоро</small></button>
    <button class="tab" disabled>Удаление <small>скоро</small></button>
    <button class="tab" disabled>Гигиена <small>скоро</small></button>
  </div>
  <div class="cases" id="cases" role="group" aria-label="Случай"></div>

  <div class="mode" role="group" aria-label="Что считаем">
    <button class="tab" id="m-visit" aria-pressed="true">Визит целиком: осмотр, анестезия, пломба</button>
    <button class="tab" id="m-fill" aria-pressed="false">Только пломба</button>
  </div>
  <div class="summary" id="summary"></div>
  <div class="list" id="list"></div>
  <details class="more" id="disputed"><summary></summary><ul></ul></details>

  <p class="foot" id="foot"></p>
</div>
<dialog class="rev" id="rev"><div class="bar"><b id="rev-title"></b><button class="btn" id="rev-close">Закрыть</button></div><iframe id="rev-frame" title="Отзывы на Яндекс Картах" loading="lazy"></iframe></dialog>
<script>
(function () {
  var state = { c: 0, mode: 'visit', metro: '' }, data = null;
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  var rub = function (v) { return Math.round(v).toLocaleString('ru-RU').replace(/,/g, ' ') + ' ₽'; };
  var date = function (s) { return s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : ''; };

  function drawCases() {
    var box = $('cases'); box.replaceChildren();
    data.cases.forEach(function (c, i) {
      var b = el('button', 'case'); b.setAttribute('aria-pressed', String(i === state.c));
      b.append(el('b', '', c.title), el('span', '', c.hint));
      b.onclick = function () { state.c = i; render(); };
      box.append(b);
    });
  }
  function drawMetro() {
    var all = {}; data.cases.forEach(function (c) { c.items.forEach(function (i) { i.metro.forEach(function (m) { all[m] = 1; }); }); });
    var sel = $('metro');
    Object.keys(all).sort(function (a, b) { return a.localeCompare(b, 'ru'); }).forEach(function (m) { sel.append(new Option(m, m)); });
    sel.onchange = function () { state.metro = sel.value; render(); };
  }
  function part(k, lines, price, note) {
    var d = el('div');
    var txt = note === 'входит в пломбу' ? 'входит в пломбу' : (lines[0] ? '«' + lines[0].name + '»' : '');
    d.append(el('span', 'k', k), el('span', 'v', txt), el('span', 'p', price == null ? '—' : rub(price)));
    return d;
  }
  function render() {
    drawCases();
    var c = data.cases[state.c], key = state.mode;
    $('m-visit').setAttribute('aria-pressed', String(key === 'visit'));
    $('m-fill').setAttribute('aria-pressed', String(key === 'fill'));
    var st = c[key], s = $('summary'); s.replaceChildren();
    var what = key === 'visit' ? 'Визит целиком, ' : 'Пломба, ';
    if (st.median != null) {
      s.append(el('div', 'sub', what + c.title.toLowerCase() + ': медиана по Москве'), el('div', 'big', rub(st.median)),
        el('div', 'sub', 'У половины клиник от ' + rub(st.p25) + ' до ' + rub(st.p75) + '. Всего от ' + rub(st.min) + ' до ' + rub(st.max) +
          '. Клиник в расчёте: ' + st.n + ', сеть считается одной клиникой.'));
    } else {
      s.append(el('div', 'sub', what + c.title.toLowerCase() + ': клиник с ценой ' + st.n + ', для медианы нужно не меньше ' + data.min_median + '. Смотрите список.'));
    }
    var items = c.items.filter(function (i) { return i.status !== 'спорно' && (!state.metro || i.metro.indexOf(state.metro) >= 0); });
    items.sort(function (a, b) {
      var av = a[key], bv = b[key];
      if (av == null && bv == null) return (a.fill || 0) - (b.fill || 0);
      if (av == null) return 1; if (bv == null) return -1; return av - bv;
    });
    var list = $('list'); list.replaceChildren();
    if (!items.length) list.append(el('p', 'empty', 'У этой станции метро пока нет клиник с ценой для этого случая.'));
    items.forEach(function (i) {
      var card = el('div', 'card'), row = el('div', 'row');
      var v = i[key];
      var price = v == null ? (key === 'visit' && i.fill != null ? 'пломба ' + rub(i.fill) : '—') : rub(v);
      if (v != null && (i.status === 'от' || (key === 'visit' && i.visit_from))) price = 'от ' + price;
      row.append(el('span', 'name', i.clinic), el('span', 'price', price));
      card.append(row);
      if (i.ya) {   // официальные виджеты Яндекса: бейдж с цифрой рейтинга и окно с отзывами, данные грузятся с Яндекса
        var rate = el('div', 'rate'), fr = document.createElement('iframe');
        fr.src = 'https://yandex.ru/sprav/widget/rating-badge/' + encodeURIComponent(i.ya) + '?type=rating';
        fr.title = 'Рейтинг организации в Яндексе'; fr.loading = 'lazy';
        var b = el('button', 'btn', 'Отзывы');
        b.onclick = function () {
          $('rev-title').textContent = i.clinic;
          $('rev-frame').src = 'https://yandex.ru/maps-reviews-widget/' + encodeURIComponent(i.ya) + '?comments';
          $('rev').showModal();
        };
        rate.append(fr, b); card.append(rate);
      }
      var where = [i.address, i.metro.length ? 'м. ' + i.metro.join(', ') : '', i.branches > 1 ? 'филиалов в базе: ' + i.branches : ''].filter(Boolean).join(' · ');
      if (where) card.append(el('div', 'where', where));
      var parts = el('div', 'parts');
      if (key === 'visit') {
        parts.append(part('Осмотр', i.exam_lines, i.exam), part('Анестезия', i.anes_lines, i.anes, i.anes_note));
      }
      parts.append(part('Пломба', i.fill_lines, i.fill));
      card.append(parts);
      if (key === 'visit' && i.visit_note) card.append(el('div', 'note', i.visit_note));
      if (i.status === 'от' || (key === 'visit' && i.visit_from)) card.append(el('div', 'note', 'В прайсе цена «от»: в медиану не идёт.'));
      var links = el('div', 'links');
      var a1 = el('a', '', 'Прайс на сайте клиники, снимок ' + date(i.snapshot)); a1.href = i.doc_url; a1.target = '_blank'; a1.rel = 'noopener';
      var a2 = el('a', '', 'Отзывы на Яндекс Картах'); a2.href = i.maps; a2.target = '_blank'; a2.rel = 'noopener';
      links.append(a1); if (!i.ya) links.append(a2); card.append(links);
      list.append(card);
    });
    var dis = c.items.filter(function (i) { return i.status === 'спорно' && (!state.metro || i.metro.indexOf(state.metro) >= 0); });
    var det = $('disputed'); det.hidden = !dis.length;
    det.querySelector('summary').textContent = 'Ещё ' + dis.length + ' клиник: в прайсе несколько вариантов, автоматически цену не выбрать';
    var ul = det.querySelector('ul'); ul.replaceChildren();
    dis.forEach(function (i) {
      var li = el('li', '', i.clinic + ': ' + i.fill_lines.map(function (l) { return '«' + l.name + '» — ' + rub(l.price); }).join('; ') + ' ');
      var a = el('a', '', 'прайс'); a.href = i.doc_url; a.target = '_blank'; a.rel = 'noopener'; li.append(a); ul.append(li);
    });
  }
  $('rev-close').onclick = function () { $('rev').close(); $('rev-frame').src = 'about:blank'; };
  $('m-visit').onclick = function () { state.mode = 'visit'; render(); };
  $('m-fill').onclick = function () { state.mode = 'fill'; render(); };
  fetch('data.json').then(function (r) { return r.json(); }).then(function (j) {
    data = j;
    $('foot').textContent = 'Розничные цены из прайсов на сайтах клиник, снимок до ' + date(j.built) + '. Пломба светового отверждения на постоянный зуб у врача без учёной степени и категории. ' +
      'Визит целиком = первичный осмотр стоматолога + инфильтрационная анестезия + пломба; если в прайсе несколько вариантов одной услуги с разными ценами, мы не выбираем самую дешёвую, а выносим клинику в отдельный список. ' +
      'Рейтинг не копируем: ссылка ведёт на карточку клиники в Яндекс Картах.';
    drawMetro(); render();
  }).catch(function () { $('summary').textContent = 'Не удалось загрузить данные.'; });
})();
</script>
</body>
</html>
