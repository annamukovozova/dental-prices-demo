function days(value){const q=quantity(value);return q!==null&&q<=365?q:null;}
function priceAfterDiscount(cents,bp){return Math.floor((cents*(10000-bp)+5000)/10000);}
function calculate(s){
 const a=percentBp(s.case.oldDiscount),b=percentBp(s.case.newDiscount);
 const issues=[];
 if(a===null)issues.push('Старая скидка: введите число от 0 до 100, не более двух знаков после запятой.');
 if(b===null)issues.push('Новая скидка: введите число от 0 до 100, не более двух знаков после запятой.');
 const confirmed=ROWS.filter(r=>s.selections[r.id].status==='confirmed');
 const pending=ROWS.filter(r=>s.selections[r.id].status==='pending');
 const excluded=ROWS.filter(r=>s.selections[r.id].status==='excluded');
 const groups=confirmed.map(r=>{
  const q=quantity(s.quantities[r.id]);
  if(!r.compatible)issues.push(r.name+': составы не подтверждены как одинаковые.');
  if(q===null)issues.push(r.name+': задайте целое количество от 0 до 999 999 или исключите услугу.');
  const op=a===null?null:priceAfterDiscount(r.oldPrice,a),np=b===null?null:priceAfterDiscount(r.newPrice,b);
  return {row:r,qty:q,oldUnit:op,newUnit:np,oldTotal:q===null||op===null?null:op*q,newTotal:q===null||np===null?null:np*q};
 });
 const valid=issues.length===0;
 const oldTotal=valid?groups.reduce((n,g)=>n+g.oldTotal,0):null;
 const newTotal=valid?groups.reduce((n,g)=>n+g.newTotal,0):null;
 const delta=valid?newTotal-oldTotal:null;
 const change=valid&&oldTotal!==0?delta/oldTotal*100:null;
 const allZero=groups.length>0&&groups.every(g=>g.qty===0);
 const sbp=percentBp(s.scenario.discount);
 let scenario=null;
 if(s.scenario.enabled&&sbp!==null&&valid&&groups.length){
  const total=groups.reduce((n,g)=>n+priceAfterDiscount(g.row.newPrice,sbp)*g.qty,0);
  scenario={total,againstNew:total-newTotal,againstOld:total-oldTotal,bp:sbp};
 }
 return {valid,issues,groups,pending,excluded,count:groups.length,oldTotal,newTotal,delta,change,allZero,scenario,scenarioValid:!s.scenario.enabled||sbp!==null};
}

  const name=$('#reviewer-name')?.value.trim()||'';
  const normalized=s=>s.normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase('ru-RU');
  const checked=Array.from(document.querySelectorAll('[data-review-check]')).every(x=>x.checked);
  const error=!name?'Укажите имя проверяющего.':normalized(name)===normalized(state.case.author)?'Проверяющий должен отличаться от автора.':!checked?'Отметьте все пункты после фактической сверки.':'';
  if(error){$('#review-error').textContent=error;return;}
  if(reviewProblems(calculate(state)).length){reviewModal();return;}
  state.review={revision:state.revision,name,at:Date.now()};save();closeModal();render();toast('Проверка отмечена для текущей демоверсии.');return;
 }
 if(action==='print'){askPrint();return;}
 if(action==='print-draft'){printNow();return;}
 if(action==='reset'){
  modalContext={type:'reset'};
  openModal('Начать демо заново?','<p>Статусы услуг, количества, сценарий и отметка проверки вернутся к исходным значениям. Оба встроенных демопрайса сохранятся.</p>','<button class="btn" data-action="close-modal">Продолжить работу</button><button class="btn primary" data-action="do-reset">Начать заново</button>');return;
 }
 if(action==='do-reset'){state=freshState();filter='all';closeModal();save();render();window.scrollTo(0,0);toast('Открыт исходный демопример.');return;}
});
document.addEventListener('input',function(event){
 const input=event.target;
 if(input.dataset.case){
  const k=input.dataset.case;if(!Object.prototype.hasOwnProperty.call(state.case,k)||state.case[k]===input.value)return;
  state.case[k]=input.value;
  const invalid=k.includes('Discount')?percentBp(input.value)===null:k.includes('Days')?days(input.value)===null:!input.value.trim();
  input.setAttribute('aria-invalid',String(invalid));changed();return;
 }
 if(input.dataset.qty){
  const id=input.dataset.qty;if(!Object.prototype.hasOwnProperty.call(state.quantities,id))return;
  if(state.quantities[id]===input.value)return;
  state.quantities[id]=input.value;changed();updateMappingSummary();return;
 }
 if(input.id==='scenario-range'||input.id==='scenario-discount'){
  if(state.scenario.discount===input.value)return;
  state.scenario.discount=input.value;changed();
  if(input.id==='scenario-range')$('#scenario-discount').value=input.value;
  else if(percentBp(input.value)!==null)$('#scenario-range').value=String(percentBp(input.value)/100);
  updateScenario();return;
 }
});
document.addEventListener('change',function(event){
 if(event.target.id==='scenario-enabled'){state.scenario.enabled=event.target.checked;changed();updateScenario();}
});
window.addEventListener('beforeprint',()=>{$('#print-report').innerHTML=makePrintReport();});
$('#modal').addEventListener('cancel',()=>{modalContext=null;});
window.DMSDemo=Object.freeze({getState:()=>JSON.parse(JSON.stringify(state)),calculate:()=>calculate(state),version:'1.0'});
restore();render();
})();
</script></body></html>
